<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Amityx</title><link rel="stylesheet" href="css/style.css"></head>
<body><main>
<h2>Contact Us</h2><p class="sub">Tell us about your idea. We usually reply within one business day.</p>
<div class="two"><form id="cf"><label>Name<input name="name" required maxlength="80"></label><label>Email<input name="email" type="email" required maxlength="120"></label>
<label>Interested in<select name="topic"><option>Custom AI solution</option><option>Software product</option><option>Consulting</option><option>Other</option></select></label>
<label>Message<textarea name="message" required maxlength="2000"></textarea></label><button class="btn p" type="submit">Send message</button><div class="msg" id="st"></div></form>
<div class="card"><h3>📍 Get in touch</h3><p>Email: hello@amityx.com<br>Phone: +91 00000 00000<br>Location: Mumbai, India</p></div></div>
</main><script src="js/main.js"></script></body></html>
